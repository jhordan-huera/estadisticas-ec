name: Publicar

# Ciclo completo: sincronizar → planificar → generar → subir imágenes → publicar.
# Por defecto en SIMULACIÓN: solo publica de verdad si la variable de repositorio
# DRY_RUN vale "false" o si se lanza a mano eligiendo el modo "real".

on:
  schedule:
    # Cada hora, en el minuto 17 (respaldo: el disparador principal puede ser externo,
    # p. ej. cron-job.org cada 5 minutos con modo "automatico").
    - cron: '17 * * * *'
  workflow_dispatch:
    inputs:
      modo:
        description: 'Modo: automatico = según la variable DRY_RUN'
        type: choice
        options: [simulacion, real, automatico]
        default: simulacion

# Una sola ejecución a la vez: la rama "estado" y la cola no admiten escrituras simultáneas.
concurrency:
  group: marcador-estado
  cancel-in-progress: false

permissions:
  contents: write
  # Para comparar con la ejecución anterior al avisar de fallos.
  actions: read

jobs:
  ciclo:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      MARCADOR_DB: estado/marcador.sqlite
      MARCADOR_MEDIA: estado/media
      MARCADOR_STATE_DIR: estado
      # Solo main publica de verdad y usa la rama "estado"; cualquier otra rama (p. ej. dev)
      # trabaja siempre en simulación y con su propio estado ("estado-<rama>").
      ESTADO_BRANCH: ${{ github.ref_name == 'main' && 'estado' || format('estado-{0}', github.ref_name) }}
      IMAGE_BASE_URL: ${{ (github.ref_name == 'main' && vars.IMAGE_BASE_URL) || format('https://raw.githubusercontent.com/{0}/{1}', github.repository, github.ref_name == 'main' && 'estado' || format('estado-{0}', github.ref_name)) }}
      # Fuera de main → siempre simulación. En main: real → publica; simulacion → simula;
      # automatico y ejecuciones programadas → variable DRY_RUN.
      DRY_RUN: ${{ (github.ref_name != 'main' && 'true') || (github.event_name == 'workflow_dispatch' && inputs.modo == 'real' && 'false') || (github.event_name == 'workflow_dispatch' && inputs.modo == 'simulacion' && 'true') || vars.DRY_RUN || 'true' }}
    steps:
      - name: Comprobar el modo (fuera de main nunca se publica de verdad)
        run: |
          echo "Rama: ${{ github.ref_name }} · estado: $ESTADO_BRANCH · DRY_RUN=$DRY_RUN"
          if [ "${{ github.ref_name }}" != "main" ] && [ "$DRY_RUN" != "true" ]; then
            echo "::error::Fuera de main solo se permite simulación"
            exit 1
          fi

      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 26
          cache: npm

      - run: npm ci

      - name: Preparar la rama de estado
        run: |
          scripts/estado.sh preparar
          echo "HUELLA_BASE=$(node src/cli/main.ts huella)" >> "$GITHUB_ENV"

      - name: Sincronizar la liga
        run: node src/cli/main.ts sincronizar --competicion serie-a

      # Las copas (TheSportsDB) no se publican, así que tampoco se sincronizan. Para volver a
      # activarlas: agregarlas en publicacion.competiciones y sincronizarlas aquí con --cada 60.

      - name: Planificar publicaciones
        run: node src/cli/main.ts planificar

      - name: Generar imágenes y textos
        run: node src/cli/main.ts generar

      - name: Borrar imágenes de más de 30 días
        run: node src/cli/main.ts limpiar --dias 30

      - name: Subir el estado (las imágenes quedan públicas antes de publicar)
        run: scripts/estado.sh guardar "generar $(date -u +'%Y-%m-%d %H:%M') UTC"

      - name: Esperar a que GitHub sirva las imágenes nuevas
        if: env.DRY_RUN == 'false'
        run: sleep 20

      - name: Publicar
        env:
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
          # Avisos opcionales: cada canal se activa solo si están sus secretos.
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          NTFY_TOKEN: ${{ secrets.NTFY_TOKEN }}
          NTFY_SERVER: ${{ vars.NTFY_SERVER }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: node src/cli/main.ts publicar

      # Se guarda aunque la publicación falle: la cola registra qué salió y evita duplicados.
      - name: Guardar el estado de la cola
        if: always() && hashFiles('estado/marcador.sqlite') != ''
        run: scripts/estado.sh guardar "publicar $(date -u +'%Y-%m-%d %H:%M') UTC"

      - name: Resumen
        if: always() && hashFiles('estado/marcador.sqlite') != ''
        run: |
          {
            echo "## Cola de publicaciones"
            echo '```'
            node src/cli/main.ts cola
            echo '```'
            echo "## Incidencias de datos (avisos y errores)"
            echo '```'
            node src/cli/main.ts incidencias --nivel warning
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      # Avisos del propio workflow, solo cuando cambia el estado (no cada 5 minutos):
      # al empezar a fallar y al volver a funcionar. No dependen de la base de datos.
      - name: Avisar si la publicación automática empezó a fallar
        if: failure() && github.ref_name == 'main'
        env:
          GH_TOKEN: ${{ github.token }}
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          NTFY_TOKEN: ${{ secrets.NTFY_TOKEN }}
          NTFY_SERVER: ${{ vars.NTFY_SERVER }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: scripts/aviso-ejecucion.sh fallo

      - name: Avisar si volvió a funcionar
        if: success() && github.ref_name == 'main'
        env:
          GH_TOKEN: ${{ github.token }}
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          NTFY_TOKEN: ${{ secrets.NTFY_TOKEN }}
          NTFY_SERVER: ${{ vars.NTFY_SERVER }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: scripts/aviso-ejecucion.sh ok
